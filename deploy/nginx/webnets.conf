# WebNets behind nginx on a small VPS (see deploy/nginx/README.md).
# nginx serves every built file from the project's dist/ folder; only the generator and the settings page go to the
# container (docker-compose.vps.yml, port 127.0.0.1:8090). Replace the server_name, the paths and the certificate lines.

upstream webnets_app {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    server_name webnets.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webnets.example.com;

    ssl_certificate     /etc/letsencrypt/live/webnets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webnets.example.com/privkey.pem;

    # the project's dist/ folder on the host (the container writes the built sites there)
    root /opt/webnets/satellite-system/dist;
    index index.html;

    # an internal tool: everything behind one login (htpasswd -c /etc/nginx/webnets.htpasswd <user>)
    auth_basic "WebNets";
    auth_basic_user_file /etc/nginx/webnets.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;  # generated and demo sites must not be indexed

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;          # the generator app and its API answers too
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    charset utf-8;
    client_max_body_size 5m;

    # the generator (app + API) and the AI settings page: PHP in the container
    location /generator {
        proxy_pass http://webnets_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # saving a site type or a market runs test builds first
        proxy_buffering off;       # brief downloads stream as they are zipped
    }
    location /settings {
        proxy_pass http://webnets_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # "Rebuild" runs the gallery rebuild
    }

    # built sites: thumbnails and pages change on every rebuild (the generator adds ?v= to thumbnails)
    location /generated/ {
        try_files $uri $uri/ =404;
        location ~* \.(png|jpe?g|webp|svg)$ { expires 7d; access_log off; }
        location ~* \.html$ { add_header Cache-Control "no-cache"; }
    }
    # gallery, review pages, screenshots, AI briefs
    location ~* \.(png|jpe?g|webp|svg|woff2?)$ { expires 7d; access_log off; try_files $uri =404; }
    location ~* \.txt$ { default_type text/plain; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }

    # never serve the gallery's working files
    location ~ /\. { deny all; }
    location ~* \.(php|py|sh|log|lock|tmp)$ { deny all; }
}
